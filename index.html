<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunhão RARA RIO</title>
    
    <!-- Fonte Google Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>

    <div class="container">
        <!-- TELA DE CARREGAMENTO (SPLASH SCREEN) -->
        <div id="loader">
            <div class="spinner-container">
                <!-- Círculo de carregamento estilo Google -->
                <svg class="spinner" viewBox="0 0 50 50">
                    <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="4"></circle>
                </svg>
                <!-- Sua Logo no centro -->
                <img src="./img/logo-rarario-transparente.webp" alt="Logo" class="loader-logo">
            </div>
        </div>

        <!-- Div com Logo em Imagem -->
        <div class="logo-wrapper">
            <img src="./img/logo-rarario-transparente.webp" alt="Logo">
        </div>

        <!-- Card "Conversão" -->
        <a href="/pages/conversao.html" style="text-decoration: none;">
            <div class="card card-conversao">
                <div class="card-content">
                    <div class="card-icon">🔄</div>
                    <h2 class="card-title">Conversão</h2>
                </div>
                <div class="step-badge">PASSO <span>01</span></div>
            </div>
        </a>

        <!-- Card "Avançai" -->
         <a href="/pages/avancai.html" style="text-decoration: none;">
            <div class="card card-avancai">
                <div class="card-content">
                    <div class="card-icon">❯❯</div>
                    <h2 class="card-title">Avançai</h2>
                </div>
                <div class="step-badge">PASSO <span>02</span></div>
            </div>
        </a>

        <!-- Card "Cura da Alma" -->
        <a href="/pages/curadaalma.html" style="text-decoration: none;">
            <div class="card card-cura">
                <div class="card-content">
                    <div class="card-icon">❤️</div>
                    <h2 class="card-title">Cura da Alma</h2>
                </div>
                <div class="step-badge">PASSO <span>03</span></div>
            </div>
        </a>

        <!-- Card "Atuação" -->
        <a href="/pages/atuacao.html" style="text-decoration: none;">
            <div class="card card-atuacao">
                <div class="card-content">
                    <div class="card-icon">🏛️</div>
                    <h2 class="card-title">Atuação</h2>
                </div>
                <div class="step-badge">PASSO <span>04</span></div>
            </div>
        </a>

    </div>

    <!-- SCRIPT PARA REMOVER O LOADER APÓS 3 SEGUNDOS -->
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.classList.add('hide');
            }, 2000); // 3000ms = 3 segundos
        });
    </script>

</body>
</html>
